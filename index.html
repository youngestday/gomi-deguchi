<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<title>ごみの出口シート</title>
<style>
/* ============================================================
   ごみの出口シート（市の切替版）
   大阪市はリーフレット8ページを1本ずつQRにし、見出しの帯を目印に置く。
   帯の画像は大阪市の制作物。出典を明記し、市が作ったように見せないこと。
   画面用の操作バー（.chrome）は印刷時に消えます。
   ============================================================ */

:root {
  --backdrop:#eceae4;
  --chrome-bg:#ffffff;
  --chrome-line:#d7d3c8;
  --chrome-ink:#1b1b1b;
  --chrome-muted:#5c594f;
  --chrome-field:#fbfaf7;
  --focus:#2f4858;
  --ok:#3f6146;
  --warn:#8a6a1f;
  --warn-bg:#f6efdc;
  --miss:#8a4a3a;
  --miss-bg:#f6ece8;

  /* 紙の色。どのテーマでも変えません */
  --paper:#ffffff;
  --paper-ink:#1b1b1b;
  --paper-rule:#cfcfc9;
  --paper-muted:#4a4a4a;
  --paper-faint:#8f8f87;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --backdrop:#191917; --chrome-bg:#242421; --chrome-line:#3b3a34;
    --chrome-ink:#eeece5; --chrome-muted:#a7a399; --chrome-field:#1e1e1c;
    --focus:#8fb4c4; --ok:#8fbf9c;
    --warn:#dcb75f; --warn-bg:#332c16; --miss:#dd9a86; --miss-bg:#33211c;
  }
}
:root[data-theme="dark"] {
  --backdrop:#191917; --chrome-bg:#242421; --chrome-line:#3b3a34;
  --chrome-ink:#eeece5; --chrome-muted:#a7a399; --chrome-field:#1e1e1c;
  --focus:#8fb4c4; --ok:#8fbf9c;
  --warn:#dcb75f; --warn-bg:#332c16; --miss:#dd9a86; --miss-bg:#33211c;
}

@page { size: A4 portrait; margin: 12mm; }
* { box-sizing: border-box; }
body {
  margin:0; background:var(--backdrop); color:var(--chrome-ink);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
}
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

/* ---------- 操作バー（画面だけ） ---------- */
.chrome { position:sticky; top:0; z-index:10;
  background:var(--chrome-bg); border-bottom:1px solid var(--chrome-line); }
.chrome-in { max-width:198mm; margin:0 auto; padding:11px 6mm;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.chrome-label { font-size:11px; font-weight:700; letter-spacing:.14em;
  color:var(--chrome-muted); white-space:nowrap; }
.chrome select { font:inherit; font-size:15px; font-weight:700; color:var(--chrome-ink);
  background:var(--chrome-field); border:1px solid var(--chrome-line);
  border-radius:3px; padding:7px 12px; min-width:11em; cursor:pointer; }
.chrome-print { font:inherit; font-size:13px; font-weight:700; letter-spacing:.06em;
  color:var(--chrome-bg); background:var(--chrome-ink);
  border:0; border-radius:3px; padding:9px 20px; cursor:pointer; }
.chrome-print:hover { opacity:.85; }
.chrome-hint { font-size:11px; color:var(--chrome-muted); }
.chrome-draft { margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.12em;
  color:var(--warn); background:var(--warn-bg); border-radius:2px; padding:4px 9px; white-space:nowrap; }
.chrome-status { max-width:198mm; margin:0 auto; padding:0 6mm 11px;
  font-size:12px; line-height:1.6; }
.chrome-status > summary { cursor:pointer; list-style:none; padding:3px 0;
  display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.chrome-status > summary::-webkit-details-marker { display:none; }
.chrome-status .tag { flex:0 0 auto; font-size:10px; font-weight:700; letter-spacing:.1em;
  border-radius:2px; padding:3px 8px; }
.st-more { margin-left:auto; flex:0 0 auto; font-size:11px; color:var(--chrome-muted);
  border:1px solid var(--chrome-line); border-radius:2px; padding:2px 8px; white-space:nowrap; }
.chrome-status[open] .st-more::after { content:"を閉じる"; }
.chrome-status:not([open]) .st-more::after { content:"を開く"; }
.chrome-status:not(.has-memo) .st-more { display:none; }
.chrome-status:not(.has-memo) > summary { cursor:default; }
.chrome-status .tag.is-ok   { color:var(--ok); background:transparent; border:1px solid currentColor; }
.chrome-status .tag.is-warn { color:var(--warn); background:var(--warn-bg); }
.chrome-status .tag.is-miss { color:var(--miss); background:var(--miss-bg); }
.chrome-status ul { margin:6px 0 0; padding-left:1.4em; color:var(--chrome-muted); }
.chrome-status li { margin-bottom:2px; }
.chrome-status .st-head { color:var(--chrome-ink); font-weight:700; }

/* 印刷が呼べなかったときだけ出す案内（Artifactの枠内では print が無視されるため） */
.chrome-help { max-width:198mm; margin:0 auto; padding:0 6mm 11px;
  font-size:12px; line-height:1.65; color:var(--warn); }
.chrome-help b { color:var(--chrome-ink); }

/* ---------- 紙面 ---------- */
.sheet { width:210mm; min-height:297mm; margin:6mm auto 12mm; padding:12mm;
  background:var(--paper); color:var(--paper-ink);
  box-shadow:0 1px 6px rgba(0,0,0,.15); }

.sheet header { border-bottom:2.5px solid var(--paper-ink); padding-bottom:1.6mm; margin-bottom:2.2mm; }
.ttl { font-size:16.5pt; font-weight:700; letter-spacing:.02em; }
.ttl .muni { font-size:11.5pt; margin-left:3mm; letter-spacing:.04em; }
.sub { font-size:8.5pt; margin-top:1.2mm; color:#3a3a3a; }

.sec { font-size:9pt; font-weight:700; letter-spacing:.06em; color:var(--paper);
  background:var(--paper-ink); display:inline-block; padding:.6mm 2.4mm; margin-bottom:1mm; }
.sec + .secnote { font-size:7.5pt; color:var(--paper-faint); margin:0 0 2mm 3mm; display:inline-block; }
.sec-wrap { margin-top:1.1mm; }
.sec-wrap:first-of-type { margin-top:0; }

.row { display:flex; align-items:center; gap:3.5mm;
  border:1px solid var(--paper-rule); border-radius:1.5mm;
  padding:.9mm 2.4mm; margin-bottom:.9mm;
  color:inherit; text-decoration:none; page-break-inside:avoid; }
a.row:hover { background:#faf9f5; }
.qr { width:16mm; height:16mm; flex:0 0 16mm;
  display:flex; align-items:center; justify-content:center; }
.qr canvas, .qr img { width:100%; height:100%; display:block; }
.qr.is-empty { border:1px dashed #b8b8b0; border-radius:1mm;
  font-size:6.5pt; color:var(--paper-faint); text-align:center; line-height:1.35; padding:2mm; }

.rtx { min-width:0; flex:1; }
.rhead { display:flex; align-items:center; gap:2.5mm; }
.pno { flex:0 0 4.5mm; text-align:right; font-size:9pt; font-weight:700;
  color:var(--paper-faint); font-variant-numeric:tabular-nums; }
.band { height:6.6mm; width:auto; max-width:110mm; display:block; }
.band.is-cover { height:10mm; }   /* 表紙バナーは横長すぎて潰れるため高くする */
.plabel { font-size:11.5pt; font-weight:700; line-height:1.25; }
.rdesc { font-size:7.5pt; color:var(--paper-muted); line-height:1.45; margin-top:1.2mm; }
.rdesc.indent { margin-left:7mm; }

/* 電池の行き先の表。紙で読ませるので線は細く、地は薄く */
.btable { width:100%; border-collapse:collapse; margin:0 0 1.1mm; font-size:6.7pt; line-height:1.3; }
.btable caption { text-align:left; font-size:8.5pt; font-weight:700; padding:0 0 1mm; }
.btable th, .btable td { border:1px solid var(--paper-rule); padding:.55mm 1.2mm;
  vertical-align:top; text-align:left; }
.btable th { background:#f0efea; font-weight:700; white-space:nowrap; }
.btable tr { page-break-inside:avoid; }
.bnote { font-size:6.4pt; color:var(--paper-muted); line-height:1.4; margin:0 0 1.6mm; }

.sheet footer { margin-top:2mm; padding-top:1.4mm; border-top:1px solid var(--paper-rule); }
.fbar { display:flex; align-items:baseline; justify-content:flex-end; gap:4mm; flex-wrap:wrap; }
.brand { font-size:11pt; font-weight:700; }
.src { font-size:5.9pt; color:#7a7a7a; line-height:1.35; margin-top:.8mm; }

@media screen and (max-width:230mm) {
  .sheet { width:auto; max-width:210mm; margin:6mm 3mm 12mm; padding:8mm; }
  .band { max-width:100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* 印刷用は最後に置く。あとから来る画面用ルールに上書きされないため */
@media print {
  body { background:#fff; }
  .chrome { display:none !important; }
  .sheet { margin:0; padding:0; box-shadow:none; width:auto; min-height:auto; }
  a.row { background:none; }
}
</style>
</head>

const M = DB.municipalities;
const sel = document.getElementById('muni');
const KEY = 'katazuke-gomi-muni';

M.forEach(function (m) {
  const o = document.createElement('option');
  o.value = m.id;
  o.textContent = m.name + (m.status === 'missing' ? '（準備中）' : '');
  sel.appendChild(o);
});

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function drawQR(box, text) {
  if (!text) { box.classList.add('is-empty'); box.textContent = '準備中'; return; }
  if (typeof QRCode === 'undefined') {
    box.classList.add('is-empty');
    box.textContent = 'QRを表示できません';
    return;
  }
  new QRCode(box, {
    text: text, width: 320, height: 320,
    colorDark: '#1b1b1b', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

// 1行分。band があれば大阪市の見出し帯を、なければ自前の文字見出しを置く
function makeRow(o) {
  const tag = o.url ? 'a' : 'div';
  const attrs = o.url
    ? ' href="' + esc(o.url) + '" target="_blank" rel="noopener noreferrer"' : '';
  const head = o.band
    ? '<span class="pno">' + o.no + '</span><img class="band'
      + (o.bandStyle === 'cover' ? ' is-cover' : '') + '" src="' + o.band
      + '" alt="' + esc(o.alt || '') + '">'
    : '<span class="plabel">' + esc(o.label) + '</span>';
  const row = el(
    '<' + tag + ' class="row"' + attrs + '>'
    + '<div class="qr"></div>'
    + '<div class="rtx"><div class="rhead">' + head + '</div>'
    + '<div class="rdesc' + (o.band ? ' indent' : '') + '">' + o.desc + '</div></div>'
    + '</' + tag + '>');
  drawQR(row.querySelector('.qr'), o.url);
  return row;
}

function section(title, note) {
  const w = document.createElement('div');
  w.className = 'sec-wrap';
  w.innerHTML = '<div class="sec">' + esc(title) + '</div>'
    + (note ? '<span class="secnote">' + esc(note) + '</span>' : '');
  return w;
}

function sodaiDesc(m) {
  const s = m.sodai;
  if (s.desc) return s.desc;   // 市ごとに書き下ろした文面があればそれを使う
  let t = s.threshold
    ? 'いちばん長い辺が30cmを超えるものは粗大ごみです。'
    : '大きな家具や家電は、ふだんのごみとは別に申し込みが必要です。';
  t += s.lead_days
    ? '<b>申し込んだ日から' + s.lead_days + '日後以降しか収集されません。</b>当日は出せません。'
    : '<b>申し込んだ当日には出せません。</b>日数がかかりますので、早めにお申し込みください。';
  const bits = [];
  if (s.tel) bits.push('電話 ' + s.tel + (s.tel_mobile ? '（携帯 ' + s.tel_mobile + '）' : ''));
  if (s.hours) bits.push(s.hours);
  if (s.fee) bits.push('手数料 ' + s.fee);
  if (bits.length) t += '<br>' + bits.join('／');
  return t;
}

function render(id) {
  const m = M.find(function (x) { return x.id === id; }) || M[0];
  const body = document.getElementById('body');
  body.innerHTML = '';
  document.getElementById('ttlMuni').textContent = m.name + '版';

  const L = m.leaflet;

  // ① リーフレット
  if (L && L.pages && L.pages.length) {
    body.appendChild(section(
      m.name + 'の「' + L.title + '」 全' + L.pages.length + 'ページ',
      '知りたいページに、直接飛べます'));
    L.pages.forEach(function (p) {
      body.appendChild(makeRow({
        no: p.no, band: p.band_data || p.band, bandStyle: p.band_style,
        alt: m.name + '「' + L.title + '」' + p.no + 'ページの見出し',
        url: p.url, desc: p.desc
      }));
    });
  } else if (L && L.url) {
    body.appendChild(section(m.name + 'の「' + L.title + '」'));
    body.appendChild(makeRow({
      label: m.name + 'の「' + L.title + '」', url: L.url,
      desc: L.desc || (m.name + 'が出している、家庭ごみの分け方・出し方の冊子です。迷ったらまずこれです。')
    }));
  } else {
    body.appendChild(section('まず、これ'));
    body.appendChild(makeRow({
      label: 'お住まいの市の「ごみリーフレット」', url: null,
      desc: 'このシートでは、' + esc(m.name) + 'のリーフレットをまだご案内できていません。'
        + 'お手数ですが、市の窓口へお問い合わせください。'
    }));
  }

  // リーフレットの節に足す1行（分別区分一覧表など）
  if (L && L.extras) {
    L.extras.forEach(function (e) {
      body.appendChild(makeRow({ label: e.label, url: e.url, desc: e.desc }));
    });
  }

  // ② 申し込む・送る
  body.appendChild(section('申し込む・送る'));
  if (m.sodai && m.sodai.url) {
    body.appendChild(makeRow({
      label: '粗大ごみを申し込む', url: m.sodai.url, desc: sodaiDesc(m)
    }));
  } else {
    body.appendChild(makeRow({
      label: '粗大ごみを申し込む', url: null,
      desc: 'このシートでは、' + esc(m.name) + 'の申込先をまだご案内できていません。'
        + 'お手数ですが、市の窓口へお問い合わせください。'
    }));
  }
  if (m.kyoten && m.kyoten.url) {
    body.appendChild(makeRow({
      label: m.kyoten.title, url: m.kyoten.url, desc: m.kyoten.desc
    }));
  }
  body.appendChild(makeRow({
    label: DB.meta.renet.title, url: DB.meta.renet.url, desc: DB.meta.renet.desc
  }));

  // ③ 市ごとの「別の出口」（乾電池・モバイルバッテリーなど）
  if (m.others && m.others.rows && m.others.rows.length) {
    body.appendChild(section(m.others.title));
    const T = m.others.table;
    if (T) {
      const w = document.createElement('div');
      w.innerHTML = '<table class="btable"><caption>' + esc(T.caption) + '</caption><thead><tr>'
        + T.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('')
        + '</tr></thead><tbody>'
        + T.rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
          }).join('')
        + '</tbody></table>'
        + (T.note ? '<p class="bnote">' + T.note + '</p>' : '');
      while (w.firstChild) body.appendChild(w.firstChild);
    }
    m.others.rows.forEach(function (o) {
      body.appendChild(makeRow({ label: o.label, url: o.url, desc: o.desc }));
    });
  }

  // 出典。CC-BY の表示義務と「市が作ったように見せない」条件に対応する
  const src = document.getElementById('src');
  const ym = function (d) {
    const a = String(d || '').split('-');
    return a.length >= 2 ? a[0] + '年' + Number(a[1]) + '月' : '';
  };
  let s = (m.checked ? ym(m.checked) + '時点の情報です。' : '') + '料金・受付条件は変わることがあります。';
  if (m.source_credit) s += '<br>' + esc(m.source_credit);
  if (m.leaflet && m.leaflet.pages) {
    s += '<br>このシートは片付けデザインが作成したもので、' + esc(m.name) + 'が作成・監修したものではありません。';
  }
  src.innerHTML = s;

  statusBlock(m);
  try { localStorage.setItem(KEY, m.id); } catch (e) {}
}

function statusBlock(m) {
  const box = document.getElementById('status');
  if (!box) return;
  let cls, tag, head;
  if (m.status === 'confirmed') {
    cls = 'is-ok'; tag = '確認済み';
    head = m.name + '：リンクは確認済み（' + m.checked + '）';
  } else if (m.status === 'partial') {
    cls = 'is-warn'; tag = '要確認';
    head = m.name + '：一部が未検証です。お客様にお渡しする前に確かめてください';
  } else {
    cls = 'is-miss'; tag = '未取得';
    head = m.name + '：リンクが未取得です。municipalities.json に追記すると、この画面に出ます';
  }
  const todo = m.todo || [];
  box.innerHTML = '<summary><span class="tag ' + cls + '">' + tag + '</span>'
    + '<span class="st-head">' + esc(head) + '</span>'
    + '<span class="st-more">メモ' + todo.length + '件</span></summary>'
    + (todo.length
        ? '<ul>' + todo.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
        : '');
  box.classList.toggle('has-memo', todo.length > 0);
  box.open = false;   // 市を切り替えるたびに畳む。画面をふさがないため
}

// 公開ビルドでは、社内向けの表示（下書きバッジ・確認メモ）を出さない
if (DB.meta && DB.meta.public) {
  document.querySelector('.chrome-draft').remove();
  document.getElementById('status').remove();
}

sel.addEventListener('change', function () { render(sel.value); });
// 印刷が本当に始まったかを beforeprint で見る。始まらなければ案内を出す
let printStarted = false;
window.addEventListener('beforeprint', function () { printStarted = true; });
document.getElementById('printBtn').addEventListener('click', function () {
  printStarted = false;
  document.getElementById('printHelp').hidden = true;
  try { window.print(); } catch (e) { /* サンドボックスでは例外も出ずに無視される */ }
  setTimeout(function () {
    if (!printStarted) document.getElementById('printHelp').hidden = false;
  }, 500);
});

let start = M[0].id;
try {
  const s = localStorage.getItem(KEY);
  if (s && M.some(function (x) { return x.id === s; })) start = s;
} catch (e) {}
sel.value = start;

if (typeof QRCode === 'undefined') {
  window.addEventListener('load', function () { render(sel.value); });
} else {
  render(start);
}
</script>

</html>
